<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The answer sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Besley:wght@800&amp;family=Libre+Franklin:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7d0c14}a:hover{color:#4a070c}
.ph{width:390px;height:844px;box-sizing:border-box;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;padding:28px 18px;background:#7d0c14;font-family:'Libre Franklin',Arial,sans-serif;color:#7d0c14}
.sheet{background:#e2e2e2;padding:22px 18px;display:flex;flex-direction:column;gap:0;flex:1}
.ln{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1.5px solid #7d0c14;font-size:15px}
.ln .n{font-family:Besley,Georgia,serif;font-weight:800;width:18px}
.ln .a{font-weight:600;flex:1}
.ln .s{font-size:13px;font-weight:600;border:1.5px solid #7d0c14;padding:1px 6px}
.sug{min-height:48px;border:0;border-bottom:1px dotted #7d0c14;background:none;text-align:left;padding:0 0 0 28px;font:600 17px 'Libre Franklin',Arial,sans-serif;color:#7d0c14;cursor:pointer}
.bar{display:inline-block;height:12px;background:#7d0c14;vertical-align:middle}
</style>
</helmet>
<div style="width: 900px; height: 924px; box-sizing: border-box; padding: 40px; background: #e4e4e4; display: flex; gap: 40px">

<div class="ph">
<div class="sheet">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 3px double #7d0c14">
<span style="font-family: Besley, Georgia, serif; font-weight: 800; font-size: 26px">Offbeat</span><span style="font-size: 13px; font-weight: 600">Answer sheet · 2 Nov</span>
</div>
<div class="ln"><span class="n">1</span><span class="a">armadillo</span><span class="s">safe</span></div>
<div class="ln"><span class="n">2</span><span class="a">pelican</span><span class="s">safe</span></div>
<div class="ln"><span class="n">3</span><span class="a">paper airplane</span><span class="s">safe</span></div>
<div style="padding: 14px 0 6px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1.5px solid #7d0c14">
<div style="display: flex; gap: 10px; align-items: baseline"><span class="n" style="font-family: Besley, Georgia, serif; font-weight: 800; width: 18px; font-size: 15px">4</span><h1 style="margin: 0; font-family: Besley, Georgia, serif; font-weight: 800; font-size: 30px; line-height: 0.95; letter-spacing: -0.02em">Name a kind of tree</h1></div>
<label style="display: flex; flex-direction: column; gap: 4px; padding-left: 28px; font-size: 13px; font-weight: 600; color: #7a4a4e">Your answer
<input value="ma" style="min-height: 48px; border: 0; border-bottom: 2px solid #7d0c14; background: #d6d6d6; padding: 0 10px; font: 600 19px 'Libre Franklin', Arial, sans-serif; color: #7d0c14">
</label>
<button class="sug" type="button">Maple</button>
<button class="sug" type="button">Magnolia</button>
<button class="sug" type="button">Mahogany</button>
<button type="button" style="min-height: 44px; border: 0; background: none; padding: 0 0 0 28px; text-align: left; font: 400 15px 'Libre Franklin', Arial, sans-serif; color: #7d0c14; text-decoration: underline">Not in the list? Send "ma"</button>
</div>
<div class="ln" style="color: #7a4a4e"><span class="n">5</span><span class="a"></span></div>
<div class="ln" style="color: #7a4a4e"><span class="n">6</span><span class="a"></span></div>
<div class="ln" style="color: #7a4a4e"><span class="n">7</span><span class="a"></span></div>
</div>
</div>

<div class="ph">
<div class="sheet" style="position: relative; flex: none">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 3px double #7d0c14">
<span style="font-family: Besley, Georgia, serif; font-weight: 800; font-size: 26px">Offbeat</span><span style="font-size: 13px; font-weight: 600">2 Nov · plor.app</span>
</div>
<div role="img" aria-label="Answers 1 to 4 safe and hidden, caught at 5, 6 and 7 blank">
<div class="ln"><span class="n">1</span><span class="a"><span class="bar" style="width: 110px"></span></span><span class="s">safe</span></div>
<div class="ln"><span class="n">2</span><span class="a"><span class="bar" style="width: 70px"></span></span><span class="s">safe</span></div>
<div class="ln"><span class="n">3</span><span class="a"><span class="bar" style="width: 140px"></span></span><span class="s">safe</span></div>
<div class="ln"><span class="n">4</span><span class="a"><span class="bar" style="width: 90px"></span></span><span class="s">safe</span></div>
<div class="ln"><span class="n">5</span><span class="a"><span class="bar" style="width: 80px"></span></span><span class="s" style="background: #7d0c14; color: #e2e2e2">caught</span></div>
<div class="ln"><span class="n">6</span><span class="a"></span></div>
<div class="ln"><span class="n">7</span><span class="a"></span></div>
</div>
<div style="position: absolute; right: 22px; bottom: 34px; transform: rotate(-8deg); border: 3px solid #7d0c14; padding: 6px 12px; font-family: Besley, Georgia, serif; font-weight: 800; font-size: 40px; line-height: 1; background: #e2e2e2">4/7</div>
<div style="height: 60px"></div>
</div>
<div style="flex: 1"></div>
<button type="button" style="min-height: 56px; border: 2px solid #e2e2e2; background: #7d0c14; color: #e2e2e2; font: 600 17px 'Libre Franklin', Arial, sans-serif">Share the sheet</button>
</div>

</div>
</x-dc>

</html>
