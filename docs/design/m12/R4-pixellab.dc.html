<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offbeat: first PixelLab art</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Source+Serif+4:wght@400;600&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0a0a0a}a:hover{color:#2436ff}
.px{image-rendering:pixelated;display:block}
</style>
</helmet>
<div style="width: 1680px; height: 1340px; box-sizing: border-box; padding: 48px; background: #e4e4e4; display: flex; flex-direction: column; gap: 48px; font-family: 'Source Serif 4', Georgia, serif; color: #0a0a0a">

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font: 600 20px 'Pixelify Sans', monospace; letter-spacing: .06em; text-transform: uppercase">The goat · pick one (shown 4× size)</h2>
<div style="display: flex; gap: 48px">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="width: 256px; height: 256px; background: #2436ff; border: 3px solid #0a0a0a"><img class="px" src="/_blob/6deb5d78520abc03f8b0250fbf31ed40" alt="Goat A: small white goat with grey horns and a red scarf" style="width: 256px; height: 256px"></div>
<figcaption style="font: 600 18px 'Pixelify Sans', monospace">A · small, grey horns</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="width: 256px; height: 256px; background: #2436ff; border: 3px solid #0a0a0a"><img class="px" src="/_blob/c09018a1fd7a701021eb99f1a6335c60" alt="Goat B: fluffy cream goat kid with a beard and a red knitted scarf" style="width: 256px; height: 256px"></div>
<figcaption style="font: 600 18px 'Pixelify Sans', monospace">B · fluffy kid, beard</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="width: 256px; height: 256px; background: #2436ff; border: 3px solid #0a0a0a"><img class="px" src="/_blob/54e0c94cc83be8e6f8bd055d2f8d4e50" alt="Goat C: round goat with big curled horns and a red scarf in the wind" style="width: 256px; height: 256px"></div>
<figcaption style="font: 600 18px 'Pixelify Sans', monospace">C · round, big curled horns</figcaption>
</figure>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font: 600 20px 'Pixelify Sans', monospace; letter-spacing: .06em; text-transform: uppercase">The trail · pick one, or neither (shown 2× size)</h2>
<div style="display: flex; gap: 48px">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<img class="px" src="/_blob/e9abbe06293193199389915da4036c4f" alt="Trail A: a stone path winds away into the distance between cliffs, clouds below" style="width: 768px; height: 384px; border: 3px solid #0a0a0a">
<figcaption style="font: 600 18px 'Pixelify Sans', monospace">A · path winding into the distance (seen from behind, not from the side)</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<img class="px" src="/_blob/3ee00aa86167b9ebccce82b094f7ef11" alt="Trail B: a stone ledge steps down along a cliff edge above a sea of clouds" style="width: 768px; height: 384px; border: 3px solid #0a0a0a">
<figcaption style="font: 600 18px 'Pixelify Sans', monospace">B · ledge along the cliff edge, sea of clouds</figcaption>
</figure>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font: 600 20px 'Pixelify Sans', monospace; letter-spacing: .06em; text-transform: uppercase">The sign · pick one (blank, then with a word painted on, 4× size)</h2>
<div style="display: flex; gap: 48px">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="width: 256px; height: 256px; background: #2436ff; border: 3px solid #0a0a0a"><img class="px" src="/_blob/59fbcf478e7c81094a60e85d5017ead9" alt="Sign A: blank cream board in a dark wooden frame on a post" style="width: 256px; height: 256px"></div>
<figcaption style="font: 600 18px 'Pixelify Sans', monospace">A · framed board, blank</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="position: relative; width: 256px; height: 256px; background: #2436ff; border: 3px solid #0a0a0a"><img class="px" src="/_blob/59fbcf478e7c81094a60e85d5017ead9" alt="Sign A with the word dogwood painted on it" style="width: 256px; height: 256px"><span style="position: absolute; left: 0; right: 0; top: 74px; text-align: center; font: 600 30px 'Pixelify Sans', monospace; color: #2a1a0a">dogwood</span></div>
<figcaption style="font: 600 18px 'Pixelify Sans', monospace">A · with a word</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="width: 256px; height: 256px; background: #2436ff; border: 3px solid #0a0a0a"><img class="px" src="/_blob/1bc9b29c6ffe52598d628dea7aa7a93a" alt="Sign B: blank weathered wooden plank on a stake" style="width: 256px; height: 256px"></div>
<figcaption style="font: 600 18px 'Pixelify Sans', monospace">B · rough plank, blank</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="position: relative; width: 256px; height: 256px; background: #2436ff; border: 3px solid #0a0a0a"><img class="px" src="/_blob/1bc9b29c6ffe52598d628dea7aa7a93a" alt="Sign B with the word dogwood painted on it" style="width: 256px; height: 256px"><span style="position: absolute; left: 0; right: 0; top: 66px; text-align: center; font: 600 30px 'Pixelify Sans', monospace; color: #f4f1e8">dogwood</span></div>
<figcaption style="font: 600 18px 'Pixelify Sans', monospace">B · with a word</figcaption>
</figure>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1680,"height":1340}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
