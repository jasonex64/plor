/* E1: the album fills up. The run's answers stay on the album as small stickers round the page: none at step 0, small and tidy on the cover at step 1, full size and askew over the page's edge at step 2, and at step 3 the rare ones get their star and gleam and the page gets a rosette. One sticker an answer, no text on them. Every size, count and timing here is the mock's guess. */
.strip{flex-wrap:wrap;row-gap:3px}
.hold{flex:0 0 100%;display:flex;align-items:center;gap:6px;min-width:0}
.hold button{min-width:30px;padding:0 9px}
.hold button.now{box-shadow:inset 0 -3px 0 #ffd84d}
.hold button[aria-pressed="true"]{background:#f4f4f4;color:#101010}
.hold .note{flex:1;min-width:0;font-size:11.5px;font-weight:400;line-height:1.15;text-align:right}
.coll{position:absolute;inset:0;z-index:4;pointer-events:none}
.ms{position:absolute;left:0;top:0;display:block;width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2);padding:2.5px;background:#fff;border-radius:5px 7px 5px 7px/7px 5px 7px 5px;box-shadow:0 0 0 .8px #2f3d5c73,0 .5px 2.5px #0c122080;translate:var(--x) var(--y);rotate:var(--a);scale:var(--s);transition:translate .36s cubic-bezier(.2,.8,.2,1) var(--d,0s),rotate .36s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.ms .bd{display:block;position:relative;height:100%;border-radius:3px 5px 3px 5px/5px 3px 5px 3px}
.ms.common .bd{box-shadow:inset 0 0 0 1.4px var(--cover)}
.ms.uncommon .bd{background:repeating-linear-gradient(-52deg,var(--cover) 0 3px,#a9bde8 3px 6px)}
.ms.rare .bd{background:conic-gradient(from 40deg at 28% 35%,#ffd84d,#ffb3dc,#9fdcff,#b9f7be,#ffe95c,#cdb8ff,#ffbe94,#ffd84d)}
[data-step="3"] .ms.rare{z-index:1}
[data-step="3"] .ms.rare .bd{background:linear-gradient(118deg,#fff0 0 22%,#ffffffe0 32%,#fff0 43% 60%,#ffffffb8 69%,#fff0 78%),conic-gradient(from 40deg at 28% 35%,#ffd84d,#ffb3dc,#9fdcff,#b9f7be,#ffe95c,#cdb8ff,#ffbe94,#ffd84d)}
.mstar{display:none;position:absolute;right:-4px;top:50%;width:21px;height:21px;margin-top:-10.5px;rotate:11deg;overflow:visible}
[data-step="3"] .mstar{display:block}
.ros{position:absolute;left:0;top:0;overflow:visible;rotate:7deg}
.ros .pn,.ros .ray{fill:none;stroke:var(--pen);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.ros .ray{stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:0}
/* A small sticker only ever moves on its own side of the page's edge: it comes in from outside and never swells or swings over what the player reads. */
@keyframes msIn{0%{translate:calc(var(--x) + var(--fx)) calc(var(--y) + var(--fy));rotate:calc(var(--a) + 30deg);scale:calc(var(--s)*.3);opacity:0}20%{opacity:1}65%{translate:var(--x) var(--y);rotate:var(--a);scale:calc(var(--s)*1.12)}100%{translate:var(--x) var(--y);rotate:var(--a);scale:var(--s)}}
@keyframes msUp{0%{scale:var(--s0)}55%{scale:calc(var(--s)*1.13)}100%{scale:var(--s)}}
@keyframes msBump{0%{translate:var(--x) var(--y);scale:var(--s)}40%{translate:calc(var(--x) + var(--fx)*.3) calc(var(--y) + var(--fy)*.3);scale:calc(var(--s)*1.13)}100%{translate:var(--x) var(--y);scale:var(--s)}}
@keyframes msStar{0%{scale:0;rotate:-80deg}60%{scale:1.12;rotate:24deg}100%{scale:1;rotate:11deg}}
@keyframes rosIn{0%{opacity:0;scale:.15;rotate:-12deg}25%{opacity:1}60%{scale:1.08;rotate:10deg}100%{scale:1;rotate:7deg}}
.ms.in{animation:msIn .34s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.ms.up{animation:msUp .46s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.ms.bump{animation:msBump .42s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}

/* The ballpoint: every line is drawn twice, a little apart, from a seeded wobble, so it is the same drawing on every replay. */
const rng=s=>()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const f=n=>Math.round(n*10)/10;
function ln(r,x1,y1,x2,y2,a){const L=Math.hypot(x2-x1,y2-y1)||1,n=Math.max(2,Math.round(L/46)),nx=-(y2-y1)/L,ny=(x2-x1)/L;let d='M'+f(x1)+' '+f(y1),px=x1,py=y1;
  for(let i=1;i<=n;i++){const t=i/n,j=i<n?(r()-.5)*2*a:0,x=x1+(x2-x1)*t+nx*j,y=y1+(y2-y1)*t+ny*j,k=(r()-.5)*a*1.6;d+='Q'+f((px+x)/2+nx*k)+' '+f((py+y)/2+ny*k)+' '+f(x)+' '+f(y);px=x;py=y}return d}
function box(r,w,h,a){const o=()=>r()*3.5-.8,j=()=>(r()-.5)*2.2;const t=j(),b=h+j(),l=j(),rt=w+j();
  return ln(r,l-o(),t+j(),rt+o(),t+j(),a)+ln(r,rt,t-o(),rt+j(),b+o(),a)+ln(r,rt+o(),b,l-o(),b+j(),a)+ln(r,l,b+o(),l+j(),t-o(),a)}
function oval(r,w,h){const cx=w/2,cy=h/2,n=9,p=[];for(let i=0;i<=n+1;i++){const g=-2.3+i/n*6.283,k=1+(r()-.5)*.1+(i>n-1?.07*(i-n+1):0);p.push([cx+Math.cos(g)*(w/2+2)*k,cy+Math.sin(g)*(h/2-1)*k])}
  let d='M'+f(p[0][0])+' '+f(p[0][1]);for(let i=1;i<p.length-1;i++)d+='Q'+f(p[i][0])+' '+f(p[i][1])+' '+f((p[i][0]+p[i+1][0])/2)+' '+f((p[i][1]+p[i+1][1])/2);return d}
function pen(e,i){const w=e.offsetWidth,h=e.offsetHeight,k=e.dataset.pen;if(!w)return;let s=e.querySelector(':scope>.fr');if(!s){e.insertAdjacentHTML('beforeend','<svg class="fr" aria-hidden="true"></svg>');s=e.lastChild}

  else if(k=='dash')o='<path class="dash" d="'+box(r,w,h,1.3)+'"/>';
  else{o='<path d="'+box(r,w,h,1.1)+'"/><path class="p2" d="'+box(r,w,h,1.1)+'"/>';
    if(k=='boxhat'){let d='';for(let x=9;x<w+3;x+=5.5)d+='M'+f(x+r()*1.5)+' '+f(h+2+r())+'l'+f(-3.4-r())+' '+f(4.6+r()*1.6);for(let y=8;y<h+2;y+=5.5)d+='M'+f(w+6.4+r())+' '+f(y+r()*1.5)+'l'+f(-3.6-r())+' '+f(4.4+r()*1.4);o+='<path class="hat" d="'+d+'"/>'}}
  s.setAttribute('viewBox','0 0 '+w+' '+h);s.innerHTML=o}

  o+='<g class="gone"><path class="v" d="M'+f(x+a)+' '+f(5+r()*3)+'Q'+f(x+(r()-.5)*2.6)+' 18 '+f(x+b)+' '+f(30+r()*3)+'"/><path class="s" pathLength="1" d="M'+f(x-4.6)+' '+f(23+r()*3)+'L'+f(x+4.6)+' '+f(10+r()*3)+'"/></g>'}

const TIER={common:'Common',uncommon:'Uncommon',rare:'Rare'},TILT={common:'-2.4deg',uncommon:'1.8deg',rare:'-3deg'};
const tally={common:10,uncommon:5,rare:1};
function count(){$('#count').textContent=given==1?'1 answer':given+' answers'}
const V={
  reset(){given=0;tally.common=10;tally.uncommon=5;tally.rare=1;score=275;step=0;root.dataset.step=0;coll=START.slice();$('#dots').innerHTML='';count();go.textContent='Next question';go.classList.remove('pressed');over.hidden=true;slot.innerHTML='<span class="hint">Your last answer sticks here</span>'},
  q(text,label){$('#qn').textContent=label;$('#q').textContent=text},

  refuse(msg,strike){kick(field,'no');if(strike)field.firstChild.insertAdjacentHTML('beforeend','<svg class="dsvg red strike" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M1 17C24 13 60 18 99 12M96 18C70 16 34 21 4 22"/></svg>');
    slot.innerHTML='<p class="said in">'+msg+'<svg class="dsvg red sq" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M2 6C14 2 22 9 34 5S56 8 68 4s20 4 30 1"/></svg></p>'},
  over(){field.classList.add('off');$('#sum').innerHTML='<dt>Points</dt><dd>'+$('#score').textContent+'</dd><dt>Answers</dt><dd>'+(tally.common+tally.uncommon+tally.rare)+'</dd><dt>Common</dt><dd>'+tally.common+'</dd><dt>Uncommon</dt><dd>'+tally.uncommon+'</dd><dt>Rare</dt><dd>'+tally.rare+'</dd>';over.hidden=false;pen(over,7)}
};
function stopClock(){clearInterval(tick);tick=null}
function paint(){const w=Math.ceil(left-1e-9);$('#secs').textContent=w;marks.forEach((m,i)=>m.setAttribute('class',i<w?'live':'gone'));root.dataset.low=left<=5?'1':'0'}
function startClock(){stopClock();let last=performance.now();tick=setInterval(()=>{const n=performance.now();left=Math.max(0,left-(n-last)/1000);last=n;paint();if(left<=0){stopClock();T.forEach(clearTimeout);T=[];V.over();state('over')}},100)}
/* The game's numbers: 20 s at Start; an answer adds 3, 5 or 8 s by its tier, 5% less for each answer the run already holds, never under 1 s; 10, 25, 50 points.
   E1's numbers, all guesses to tune: the steps arrive at 300, 450 and 600 points. The round opens on question 2 of a run that is already going well, with sixteen answers given (ten Common, five Uncommon, one Rare: 275 points) and 17 s left, and runs about 40 s. */
const PTS={common:10,uncommon:25,rare:50},SEC={common:3,uncommon:5,rare:8},STEPS=[300,450,600],HOLD_AT=[2900,12300,26500,36500];
const START=['common','common','uncommon','common','rare','common','uncommon','common','common','uncommon','common','common','uncommon','common','uncommon','common'];
const DIM={common:[40,19],uncommon:[44,20],rare:[48,21]},SMALL=.72;
const phone=$('#phone'),C=$('#coll'),HB=[...document.querySelectorAll('[data-h]')];
const MSTAR=STAR.slice(0,STAR.indexOf('</svg>')+6).replace('class="star"','class="mstar"');
/* The rosette: a die-cut sticker in the star's foil, a ballpoint star drawn in its middle. Still. */
C.innerHTML=(function(){const r=rng(77),cx=22,cy=19,K=['#fff3a6','#f5b93a','#ffe26a','#ffd0e6','#fff6c4','#f1ad2e','#ffe680','#c9ecff','#fff0a0','#f7c248'],tl='M15 27 9.500 46.500 14.500 43 18.500 48 22.500 30z',tr='M29 27 34.500 46.500 29.500 43 25.500 48 21.500 30z';
  let sc='';for(let i=0;i<12;i++)sc+='<circle cx="'+f(cx+Math.cos(i*Math.PI/6)*13)+'" cy="'+f(cy+Math.sin(i*Math.PI/6)*13)+'" r="R"/>';
  let o='<svg class="ros" id="ros" viewBox="0 0 44 50" aria-hidden="true" hidden><g fill="#2f3d5c" fill-opacity=".28" transform="translate(1 1.800)"><path d="'+tl+tr+'"/><circle cx="22" cy="19" r="17"/></g><path d="'+tl+tr+'" fill="#fff" stroke="#fff" stroke-width="2.600" stroke-linejoin="round"/><path d="'+tl+'" fill="#2a4192"/><path d="'+tr+'" fill="#a9bde8"/><g fill="#fff">'+sc.replace(/R/g,'5.400')+'<circle cx="22" cy="19" r="14"/></g><g fill="#f5b93a">'+sc.replace(/R/g,'3.900')+'</g>';
  for(let i=0;i<10;i++){const a=i*Math.PI/5-.3,b=a+Math.PI/5;o+='<path d="M22 19L'+f(cx+Math.cos(a)*12.6)+' '+f(cy+Math.sin(a)*12.6)+'A12.600 12.600 0 0 1 '+f(cx+Math.cos(b)*12.6)+' '+f(cy+Math.sin(b)*12.6)+'z" fill="'+K[i]+'" stroke="'+K[i]+'" stroke-width=".400"/>'}
  const pt=[0,2,4,1,3,0].map((k,i)=>{const g=-Math.PI/2+k*Math.PI*2/5,R=5.7+(r()-.5)*1.1+(i==5?.9:0);return f(cx+Math.cos(g)*R+(i==5?.7:0))+' '+f(cy+.4+Math.sin(g)*R)});
  o+='<circle cx="22" cy="19" r="7.600" fill="#fff"/><path class="pn" d="M'+pt.join('L')+'"/>';
  [-38,-11,17,219,191,163].forEach(g=>{const a=g*Math.PI/180,R1=18.8+r(),R2=22.4+r()*1.4;o+='<path class="ray" pathLength="1" d="M'+f(cx+Math.cos(a)*R1)+' '+f(cy+Math.sin(a)*R1)+'L'+f(cx+Math.cos(a+.05)*R2)+' '+f(cy+Math.sin(a+.05)*R2)+'"/>'});
  return o+'</svg>'})();
const ros=$('#ros');
/* Where the small stickers go: nineteen slots down the two sides, eight along the bottom, four beside the emblem, from one seed, so every replay sticks them in the same places. A side slot keeps clear of everything the player reads or presses: where the input's shading reaches out, its sticker sits further out on the cover. */
const rel=(e,P)=>{const q=e.getBoundingClientRect();return{l:q.left-P.left,t:q.top-P.top,r:q.right-P.left,b:q.bottom-P.top}};
const grow=(q,l,t=l,r=l,b=t)=>({l:q.l-l,t:q.t-t,r:q.r+r,b:q.b+b});
function buildSlots(){const P=phone.getBoundingClientRect(),W=P.width,q=s=>rel($(s),P),sh=q('#sheet'),hd=q('.hdr'),ck=q('.clock'),fw=q('.fw'),ft=q('.foot'),gb=q('#go'),em=q('.emblem'),qn=q('#qn'),sc=q('.score'),kt=q('.kr').t,bs=[...document.querySelectorAll('.top .btn')].map(e=>rel(e,P));
  const prot=[grow(bs[0],4),grow(bs[1],4),grow(em,3),grow(qn,4),grow(sc,5),grow(ck,3),grow(q('.qw'),3),grow(fw,3,3,10,9),grow(q('.slotw'),4),grow(ft,3),grow(gb,4)];
  G={cx:(sh.l+sh.r)/2,cy:(sh.t+sh.b)/2,L:[-6,ck.l-4],R:[fw.r+4,W+6],cov:{L:[-3,sh.l+1.5],R:[sh.r-1.5,W+3]},bot:[Math.max(ft.b,gb.b)+7,kt-2],cb:[sh.b+1,kt-3],top:[[bs[0].r+5,em.l-4],[em.r+4,bs[1].l-5]],ty:[2,hd.t-4],ros:{x:(qn.r+sc.l)/2,t:Math.max(hd.t-4,em.b+2),b:ck.t-3}};
  const r=rng(20261126),edge=[];
  const zone=(z,n,a,b)=>{const off=r();for(let j=0;j<n;j++){let p=a+(b-a)*(j+.5+(r()-.5)*.62)/n;const len=.9+r()*.22,s={z,len,u:r()*2-1,v:r(),flip:r()<.5,k:(j*.618+off)%1+r()*.12};
    s.p=p;if(z!='B'){const hl=DIM.rare[0]*len/2+5,lim=q=>{let lo=G[z][0],hi=G[z][1];prot.forEach(o=>{if(q-hl<o.b&&q+hl>o.t&&o.l<hi&&o.r>lo){if(z=='L')hi=Math.min(hi,o.l-2);else lo=Math.max(lo,o.r+2)}});return[lo,hi]};
      s.b=lim(p);for(let i=0;i<60&&s.b[1]-s.b[0]<21;i++){p+=(i%2?-1:1)*(i+1)*4;s.p=Math.min(b,Math.max(a,p));s.b=lim(s.p)}}
    edge.push(s)}};
  zone('L',10,28,kt-30);zone('R',9,28,kt-30);zone('B',8,26,W-26);
  edge.sort((a,b)=>a.k-b.k);
  SL=edge.concat([[0,1],[1,1],[1,0],[0,0]].map(([g,up])=>({z:'T',g,up,len:.9+r()*.12,u:r()*2-1,v:r(),flip:r()<.5})))}
function fit(sl,t,st){const d=DIM[t],w=d[0]*sl.len,h=d[1],rd=x=>x*Math.PI/180;let k=st==1?SMALL:1,lw=(w+(t=='rare'?5:0))*k,lh=(h+(t=='rare'?1.5:0))*k;const
    over=(g,p,o)=>p*Math.cos(rd(g))+o*Math.sin(rd(Math.abs(g))),most=(p,o,B,cap)=>{for(let g=cap;g>0;g-=.5)if(over(g,p,o)<=B)return g;return 0};
  let x,y,a;const sq=B=>{if(lh>B-1){const q=(B-1)/lh;k*=q;lw*=q;lh*=q}};
  if(sl.z=='T'){const g=G.top[sl.g],B=g[1]-g[0];a=sl.u*most(lw,lh,B,16);const bw=over(a,lw,lh),bh=over(a,lh,lw);x=g[0]+Math.min(B,bw)/2+sl.v*Math.max(0,B-bw);y=sl.up?G.ty[0]+bh/2+1:G.ty[1]-bh/2;if(sl.flip)a+=180}
  else{const side=sl.z!='B',b=st==1?(side?G.cov[sl.z]:G.cb):side?sl.b:G.bot,B=b[1]-b[0],g=(sq(B),sl.u*most(lh,lw,B,st==1?5:14)),ac=over(g,lh,lw),c=b[0]+Math.min(B,ac)/2+sl.v*Math.max(0,B-ac);
    if(side){x=c;y=sl.p;a=(sl.flip?-90:90)+g}else{x=sl.p;y=c;a=(sl.flip?180:0)+g}}
  return{x,y,a,s:k,w,h}}
function put(e,i){const sl=SL[i];e.hidden=!sl;if(!sl)return;const p=fit(sl,coll[i],step||1),st=e.style,o={L:[-22,0],R:[22,0],B:[0,20],T:[0,-20]}[sl.z];
  [['w',f(p.w)+'px'],['h',f(p.h)+'px'],['x',f(p.x)+'px'],['y',f(p.y)+'px'],['a',f(p.a)+'deg'],['s',p.s],['fx',o[0]+'px'],['fy',o[1]+'px']].forEach(([k,v])=>st.setProperty('--'+k,v))}
function mk(i,cls,d){const t=coll[i],e=el('i','ms '+t+(cls?' '+cls:''),'<i class="bd"></i>'+(t=='rare'?MSTAR:''));if(d)e.style.setProperty('--d',d.toFixed(2)+'s');els[i]=e;put(e,i);C.appendChild(e)}
function placeRos(){const o=G.ros,h=Math.min(o.b-o.t-8,42),w=h*.88;ros.style.cssText='width:'+f(w)+'px;height:'+f(h)+'px;left:'+f(o.x-w/2)+'px;top:'+f(o.t+4)+'px'}
function render(){els.forEach(e=>e.remove());els=[];if(step)coll.forEach((_,i)=>mk(i));ros.toggleAttribute('hidden',step<3);ros.classList.remove('in');placeRos()}
function relayout(){buildSlots();els.forEach(put);placeRos()}
function mark(){HB.forEach((b,i)=>{b.classList.toggle('now',i==step);b.setAttribute('aria-pressed',hold==i)})}
/* An accepted answer joins the collection. Between steps its small sticker lands alone; when the points cross a step, the whole collection answers: at step 1 every earlier answer is stuck on in turn, at step 2 they are pressed on again larger and askew, at step 3 they all jump, the rare ones get their stars and the rosette is stamped on. Then nothing moves. */
function collect(tier){coll.push(tier);const was=step,n=coll.length-1;step=STEPS.filter(p=>score>=p).length;root.dataset.step=step;mark();
  if(step>was){if(!was)coll.forEach((_,i)=>mk(i,'in',.2+i*.045));
    else{els.forEach((e,i)=>{e.style.setProperty('--s0',e.style.getPropertyValue('--s'));e.style.setProperty('--d',(.12+i*.03).toFixed(2)+'s');put(e,i);e.className='ms '+coll[i]+(step==2&&was==1?' up':' bump')});mk(n,'in',.3+n*.03)}
    if(step==3){ros.toggleAttribute('hidden',false);placeRos();kick(ros,'in')}}
  else if(step)mk(n,'in',.26)}
function ans(t,w,name,tier){t=typeWord(t,w,90);at(t+250,()=>{const s=Math.max(1,SEC[tier]*Math.pow(.95,coll.length));left+=s;score+=PTS[tier];V.accept({name,tier,secs:s.toFixed(1),pts:PTS[tier]});V.score(score);paint();state(tier=='rare'?'accepted-big':'accepted');collect(tier)})}
function no(t,w,msg,strike){t=typeWord(t,w,90);at(t+250,()=>{V.refuse(msg,strike);state('refused')});at(t+1100,fClear)}
function script(){
  left=17;V.q('Name a kind of cheese','Question 2 of 3');V.score(score);paint();state('waiting');
  ans(1200,'cheddar','Cheddar','common');
  ans(3300,'feta','Feta','uncommon');/* 310 points: step 1 */
  ans(6200,'taleggio','Taleggio','rare');
  no(9000,'cheddar','Already said',false);
  ans(10900,'brie','Brie','common');
  no(12900,'cheez','Not on the list',true);
  ans(14600,'edam','Edam','uncommon');
  ans(16500,'manchego','Manchego','uncommon');
  ans(18800,'roquefort','Roquefort','rare');/* 470 points: step 2 */
  at(22300,()=>go.classList.add('pressed'));
  at(22550,()=>{go.classList.remove('pressed');go.textContent='Finish';given=0;$('#dots').innerHTML='';count();V.q('Name a river','Question 3 of 3');slot.innerHTML='';fClear();state('waiting')});
  ans(23100,'nile','Nile','common');
  ans(24900,'danube','Danube','uncommon');
  ans(27000,'okavango','Okavango','rare');
  ans(29400,'volga','Volga','uncommon');
  ans(31600,'mekong','Mekong','rare');/* 630 points: step 3 */
  ans(35000,'rhine','Rhine','common');
  typeWord(37000,'amazo',480);
}
/* Played, the round runs on its timers. Held at a step (the strip's Step buttons), the same round is run through at once to a moment inside that step and stopped there, with nothing moving. */
function run(){EV=[];script();EV.sort((a,b)=>a[0]-b[0]);
  if(hold<0){startClock();EV.forEach(([ms,fn])=>T.push(setTimeout(fn,ms)));return}
  let p=0;for(const[ms,fn]of EV){if(ms>HOLD_AT[hold])break;left-=(ms-p)/1000;p=ms;fn()}
  left-=(HOLD_AT[hold]-p)/1000;paint();state('waiting')}
function restart(){T.forEach(clearTimeout);T=[];stopClock();root.classList.toggle('still',hold>=0);fClear();V.reset();buildSlots();render();mark();run()}
function play(){hold=-1;restart()}
rmBox.checked=RM;root.classList.toggle('rm',RM);
rmBox.addEventListener('change',()=>{RM=rmBox.checked;root.classList.toggle('rm',RM);restart()});
phone.addEventListener('click',play);$('#replay').addEventListener('click',play);
HB.forEach((b,i)=>b.addEventListener('click',()=>{hold=i;restart()}));
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{draw();relayout()},120)});
restart();draw();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{draw();relayout()});
</script>
