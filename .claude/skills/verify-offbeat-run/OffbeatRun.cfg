\* The rules the code keeps. Questions: three (the human, 2026-11-23, M23 answer 5); two tabs (the human, 2026-11-17,
\* docs/milestones/PROCESS-formal-verification.md answer 9); two answers a question are enough to tell a repeat from a
\* second answer. Locked = TRUE is the code; FALSE is the run without its lock, which must break (SKILL.md, "Run it").
CONSTANTS
  Questions = 3
  Tabs = {"A", "B"}
  Answers = {"x", "y"}
  Locked = TRUE
SPECIFICATION Spec
INVARIANTS
  NoAnswerAfterEnd
  OnlyTheOpenQuestion
  CountIncludesEveryEarlierAnswer
  NextOnlyForward
  FinishOnlyOnLast
  AnswersOnlyForOpened
